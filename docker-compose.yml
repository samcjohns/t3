# Local development stack. Passwords default to development values; override
# them with environment variables (or a .env file) for anything shared.
# Every container, image and volume is named for the t3 project.
name: t3

services:
  postgres:
    container_name: t3-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: t3
      POSTGRES_PASSWORD: ${T3_POSTGRES_PASSWORD:-postgres-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "t3"]
      interval: 2s
      retries: 30

  server:
    container_name: t3-server
    image: t3-server
    build: { context: ., target: server }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "${T3_PORT:-8080}:8080"
    volumes:
      - archive:/var/lib/t3/archive
    environment:
      T3_ENGINE_DATABASE_URL: postgres://t3_engine:engine-dev@postgres:5432/t3?sslmode=disable
      T3_LEDGER_DATABASE_URL: postgres://t3_ledger:ledger-dev@postgres:5432/t3?sslmode=disable
      T3_GATEWAY_DATABASE_URL: postgres://t3_gateway:gateway-dev@postgres:5432/t3?sslmode=disable
      T3_ADMIN_PASSWORD: ${T3_ADMIN_PASSWORD:-admin-dev-password}
      T3_MARKET_MAKER_PASSWORD: ${T3_MARKET_MAKER_PASSWORD:-maker-dev-password}
      T3_HEARTBEAT: ${T3_HEARTBEAT:-10s}
      T3_ARCHIVE_DIR: /var/lib/t3/archive
      # Browser origins that may call the API: the web app, plus any other
      # sites that use it.
      T3_ALLOWED_ORIGINS: ${T3_ALLOWED_ORIGINS:-http://localhost:${T3_WEB_PORT:-3000}}
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s

  mm-liquidity:
    container_name: t3-mm-liquidity
    image: t3-marketmaker
    build: { context: ., target: marketmaker }
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
    environment:
      T3_API_URL: http://server:8080
      T3_MM_USERNAME: mm-liquidity
      T3_MM_PASSWORD: ${T3_MARKET_MAKER_PASSWORD:-maker-dev-password}
      T3_MM_STRATEGY: liquidity

  mm-flow:
    container_name: t3-mm-flow
    image: t3-marketmaker
    build: { context: ., target: marketmaker }
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
    environment:
      T3_API_URL: http://server:8080
      T3_MM_USERNAME: mm-flow
      T3_MM_PASSWORD: ${T3_MARKET_MAKER_PASSWORD:-maker-dev-password}
      T3_MM_STRATEGY: flow

  mm-momentum:
    container_name: t3-mm-momentum
    image: t3-marketmaker
    build: { context: ., target: marketmaker }
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
    environment:
      T3_API_URL: http://server:8080
      T3_MM_USERNAME: mm-momentum
      T3_MM_PASSWORD: ${T3_MARKET_MAKER_PASSWORD:-maker-dev-password}
      T3_MM_STRATEGY: momentum

  mm-news:
    container_name: t3-mm-news
    image: t3-marketmaker
    build: { context: ., target: marketmaker }
    depends_on:
      server: { condition: service_healthy }
    restart: unless-stopped
    environment:
      T3_API_URL: http://server:8080
      T3_MM_USERNAME: mm-news
      T3_MM_PASSWORD: ${T3_MARKET_MAKER_PASSWORD:-maker-dev-password}
      T3_MM_STRATEGY: news

  web:
    container_name: t3-web
    image: t3-web
    build: { context: ./web }
    restart: unless-stopped
    ports:
      - "${T3_WEB_PORT:-3000}:8080"
    environment:
      # The API address browsers use. It is served to the app as /config.json.
      T3_API_URL: ${T3_PUBLIC_API_URL:-http://localhost:${T3_PORT:-8080}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    name: t3-pgdata
  archive:
    name: t3-archive
