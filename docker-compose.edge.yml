# Production override: serve t3 through a reverse proxy or tunnel in another
# Compose project instead of host ports. deploy.sh applies it when
# T3_EDGE_NETWORK names a shared external Docker network; the proxy joins the
# same network and reaches the API at http://t3-server:8080 and the web app at
# http://t3-web:8080, each on its own public hostname.
services:
  server:
    ports: !reset []
    networks: [default, edge]
    environment:
      # The edge network's subnet: connections from it may name the real
      # client in CF-Connecting-IP. deploy.sh fills this in.
      T3_TRUSTED_PROXIES: ${T3_TRUSTED_PROXIES:?set by deploy.sh}

  web:
    ports: !reset []
    networks: [edge]
    environment:
      # Browsers call the API directly, so this must be its public address.
      T3_API_URL: ${T3_PUBLIC_API_URL:?set T3_PUBLIC_API_URL to the API's public address}

networks:
  edge:
    name: ${T3_EDGE_NETWORK:?}
    external: true
